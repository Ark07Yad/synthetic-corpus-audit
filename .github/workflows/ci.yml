name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (test extras only)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Assert zero runtime dependencies
        # OBJECTIVE.md G2: chaff must import on a stock interpreter. If a runtime
        # dependency ever sneaks into pyproject.toml, this step fails the build.
        run: |
          python - <<'PY'
          import tomllib, pathlib, sys
          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          deps = data["project"].get("dependencies", [])
          if deps:
              sys.exit("runtime dependencies are not permitted, found: {0}".format(deps))
          print("confirmed: zero runtime dependencies")
          PY
        if: matrix.python-version != '3.9'

      - name: Test
        run: python -m pytest -q

      - name: Smoke-test the CLI on the sample corpus
        run: |
          chaff --version
          chaff families
          chaff profile data/samples/mixed_sample.jsonl
          chaff profile data/samples/mixed_sample.jsonl --json > /dev/null
          chaff inspect data/samples/mixed_sample.jsonl -n 1
